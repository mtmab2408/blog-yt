name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Run unit tests
        run: npm run test -- --reporter junit --outputFile reports/vitest-report.xml

      - name: Run lint report
        run: npm run lint -- --format json --output-file reports/eslint-report.json

      - name: Build app
        run: npm run build

      - name: Build docs
        run: npm run docs

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          tar -czf artifacts/dist.tgz dist
          tar -czf artifacts/docs-reference.tgz docs/reference
          tar -czf artifacts/reports.tgz reports

      - name: Generate changelog
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            range="${prev_tag}..${GITHUB_REF_NAME}"
          else
            range=""
          fi
          if [ -n "$range" ]; then
            git log --pretty=format:"- %s (%h)" "$range" > CHANGELOG.md
          else
            git log --pretty=format:"- %s (%h)" > CHANGELOG.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            artifacts/dist.tgz
            artifacts/docs-reference.tgz
            artifacts/reports.tgz
